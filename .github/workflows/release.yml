name: Release

# Pushing an annotated v<pubspec version> tag for a green main commit
# re-verifies that source, publishes it to pub.dev (skipped when pub.dev
# already has the version) and then publishes the GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # pub.dev tag pattern: v{{version}}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out main and existing tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag version, main ancestry, changelog and green CI
        run: python3 .github/scripts/release.py validate "$TAG"
      - name: Check out exact validated release source
        run: git checkout --detach "refs/tags/$TAG"
      - name: Set up Dart
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 3.13.0
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze package
        run: dart analyze --fatal-infos
      - name: Test release source
        run: dart test
      - name: Compile and run example
        run: |
          mkdir -p build
          dart compile exe example/dartarrow_example.dart -o build/arrow-example
          ./build/arrow-example
      - name: Rebuild guide and API reference
        run: python3 tool/build_docs.py
      - name: Validate publishing without publishing
        run: dart pub publish --dry-run
      - name: Archive exact tag and calculate checksum
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="dartarrow-$TAG/" --output="release-assets/dartarrow-$TAG-source.tar.gz" "refs/tags/$TAG"
          (cd release-assets && sha256sum "dartarrow-$TAG-source.tar.gz" > SHA256SUMS)
      - name: Test source archive outside Git
        run: |
          mkdir -p "$RUNNER_TEMP/arrow-release"
          tar -xzf "release-assets/dartarrow-$TAG-source.tar.gz" -C "$RUNNER_TEMP/arrow-release"
          cd "$RUNNER_TEMP/arrow-release/dartarrow-$TAG"
          test ! -e .git
          dart pub get --enforce-lockfile
          dart test
          dart pub publish --dry-run
      - name: Extract release notes from the changelog
        run: python3 .github/scripts/release.py notes "$TAG" --notes release-notes.md
      - name: Hand verified assets to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  pub-dev:
    name: Publish to pub.dev
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pub.dev can be told to require this environment (package Admin tab);
    # add required reviewers to it on GitHub to gate every publication.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token that pub.dev exchanges for publishing rights
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ask pub.dev whether this version already exists
        id: state
        run: python3 .github/scripts/release.py pub-dev-state "$TAG" >> "$GITHUB_OUTPUT"
      - name: Set up Dart and the pub.dev OIDC token
        if: steps.state.outputs.published != 'true'
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 3.13.0
      - name: Publish to pub.dev
        if: steps.state.outputs.published != 'true'
        run: |
          dart pub get --enforce-lockfile
          dart pub publish --force

  github-release:
    name: Publish GitHub release
    needs: [verify, pub-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish the GitHub release
        run: python3 .github/scripts/release.py publish "$TAG" --directory dist/release-assets --notes dist/release-notes.md
